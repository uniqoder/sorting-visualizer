[project]
name = "sorting-visualizer"
version = "0.1.0"
description = "A simple visualizer to compare different sorting algorithms."
authors = [
    { name = "Uniqoder", email = "uniqoder1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sorting-visualizer = "sorting_visualizer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
